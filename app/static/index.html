<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas</title>
    <meta name="description" content="LLM-driven HTML canvas.">
    <meta name="theme-color" content="#0b0b0f">
    <link rel="stylesheet" href="index.css?v=3.1">
    <script src="lib/dompurify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Cytoscape: renders the wallet/holder-network graph (language-graph blocks). -->
    <script src="lib/cytoscape.min.js"></script>
    <!-- Tailwind CSS and Alpine.js for agentic UI generation -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="js/widgets.js?v=1.4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <!-- Tech monospace for HUD labels / telemetry readouts (falls back to a system
         mono stack if the CDN is unreachable). -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- HUD overlay theme. MUST load after index.css: it is a final override layer
         that re-skins the calm-neutral block at the tail of index.css into the
         restrained sci-fi HUD look. Class-safe / CSS-only. -->
    <link rel="stylesheet" href="hud-theme.css?v=1.1">
    <!-- Apply the saved palette BEFORE first paint so a reload never flashes the
         default cyan theme. The full engine (persist, chart recolor) is in index.js. -->
    <script>
        try {
            var t = localStorage.getItem("html_notes_theme");
            if (t && t !== "hud") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
    </script>
</head>
<body>
    <!-- App rail: collapsible launcher of the user's own apps (the same
         curated /api/services list the App Hub grid polls). Page chrome, NOT
         a widget — it lives outside #live-canvas so canvas serialization and
         self-heal never touch it. Contents rendered by initAppRail (index.js). -->
    <aside id="app-rail" class="app-rail" aria-label="Your apps"></aside>

    <!-- Live Canvas Area -->
    <div id="live-canvas" class="live-canvas">
        <div id="dashboard-grid" class="dashboard-grid">
            <div id="welcome-message" class="system-message">
                <h1>Canvas</h1>
                <p>Ask for anything &mdash; a video, the weather, some jazz, a chart. It arrives as a widget.</p>
            </div>
        </div>
    </div>

    <!-- Agent activity log -->
    <div id="execution-log-container" class="execution-log-container" style="display: none;">
        <div class="execution-log-header">
            <span>Activity</span>
            <button id="btn-toggle-log" class="btn-toggle-log" title="Toggle Log">▼</button>
        </div>
        <div id="execution-log-content" class="execution-log-content"></div>
    </div>

    <!-- Speech Overlay for live TTS / Word animation -->
    <div id="speech-overlay" class="speech-overlay"></div>

    <!-- Per-query status bars: one row per in-flight turn, stacked above the
         command bar (populated by createTurnStatus in index.js). -->
    <div id="turn-status-container" class="turn-status-container" style="display: none;"></div>

    <!-- Command bar -->
    <div class="command-palette">
        <div class="input-row">
            <button id="btn-mic" class="btn-icon" title="Record Voice">
                <svg viewBox="0 0 24 24">
                    <path fill="currentColor" d="M12,14A3,3 0 0,0 15,11V5A3,3 0 0,0 12,2A3,3 0 0,0 9,5V11A3,3 0 0,0 12,14M17.3,11C17.3,14 14.76,16.2 12,16.2C9.24,16.2 6.7,14 6.7,11H5C5,14.41 7.72,17.23 11,17.72V21H13V17.72C16.28,17.23 19,14.41 19,11H17.3Z"/>
                </svg>
            </button>
            <button id="btn-mute" class="btn-icon" title="Toggle Mute">
                <svg viewBox="0 0 24 24">
                    <path fill="currentColor" d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.85 14,18.71V20.77C18,19.86 21,16.28 21,12C21,7.72 18,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16C15.5,15.29 16.5,13.77 16.5,12M3,9V15H7L12,20V4L7,9H3Z"/>
                </svg>
            </button>
            <button id="btn-forget" class="btn-icon" title="Forget what you remember about me">
                <svg viewBox="0 0 24 24">
                    <path fill="currentColor" d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4C14.1,4 16,4.8 17.4,6.1L6.1,17.4C4.8,16 4,14.1 4,12A8,8 0 0,1 12,4M12,20C9.9,20 8,19.2 6.6,17.9L17.9,6.6C19.2,8 20,9.9 20,12A8,8 0 0,1 12,20Z"/>
                </svg>
            </button>

            <textarea id="chat-input" placeholder="Ask for anything…" rows="1"></textarea>

            <!-- Shown only while messages are waiting behind the running turn. -->
            <span id="queue-badge" class="queue-badge" style="display: none;"></span>

            <select id="model-select" class="model-select" title="Select Model">
                <option value="">Loading…</option>
            </select>

            <button id="btn-send-message" class="btn-send" title="Send">
                <svg viewBox="0 0 24 24">
                    <path fill="currentColor" d="M2,21L23,12L2,3V10L17,12L2,14V21Z"/>
                </svg>
            </button>
            <button id="btn-stop-message" class="btn-stop" title="Stop" style="display: none;">
                <svg viewBox="0 0 24 24">
                    <path fill="currentColor" d="M6,6H18V18H6V6Z"/>
                </svg>
            </button>
        </div>
        <div id="recording-status" class="recording-status" style="display: none;">
            <span class="pulse"></span> Recording…
        </div>
        <div id="health-indicator" class="health-dot offline" title="System Status"></div>
    </div>

    <!-- Bump this on every index.js change or browsers keep running the cached
         copy (v3.0 was frozen while index.js changed underneath it). v3.1: stop
         sending use_lazy_agent so the server's PRISM MODE default governs.
         v3.2: in-flight envelope card + live-streaming chat bubble. -->
    <script src="index.js?v=3.2"></script>
    <!-- Masonry layout: pairs with the .dashboard-grid CSS (1px row track). Gives
         each widget a grid-row span equal to its height so varying-height widgets
         pack tightly with no whitespace, and reflows as widgets are added, removed
         or resized. Deliberately standalone (no index.js edits).
         `.turn-envelope` is the in-flight card for a running agent turn. It is
         listed HERE rather than being given `.widget-container` so that it stays
         invisible to every other sweep keyed on the widget classes — the saved
         layout order, the snapshot seeder, the close-button injector and the
         random-id assigner would all otherwise treat a transient card as a real
         widget (and persist it). Spanning is the ONE widget behaviour it needs. -->
    <script>
    (function () {
        var GAP = 20; // px vertical gap between stacked widgets
        function spanFor(el) {
            var h = Math.ceil(el.getBoundingClientRect().height);
            if (h > 0) el.style.gridRowEnd = 'span ' + (h + GAP);
        }
        function layout() {
            var grid = document.querySelector('#dashboard-grid');
            if (!grid) return;
            grid.querySelectorAll('.widget-container, .glass-card, .turn-envelope').forEach(spanFor);
        }
        window.__masonryLayout = layout;
        var ro = (typeof ResizeObserver !== 'undefined')
            ? new ResizeObserver(function (entries) { entries.forEach(function (e) { spanFor(e.target); }); })
            : null;
        function observeAll() {
            var grid = document.querySelector('#dashboard-grid');
            if (!grid || !ro) return;
            grid.querySelectorAll('.widget-container, .glass-card').forEach(function (w) {
                if (!w.__masonryObserved) { w.__masonryObserved = true; ro.observe(w); }
            });
        }
        var pending = null;
        function schedule() {
            if (pending) return;
            pending = requestAnimationFrame(function () {
                pending = null; observeAll(); layout();
                // A second pass after the frame catches widgets whose height only
                // settles once Alpine fills their x-text (stock_card, weather) or
                // markdown/images reflow — the ResizeObserver covers most of this,
                // but this guarantees a correct span even if a widget's size lands
                // between observer notifications.
                setTimeout(function () { observeAll(); layout(); }, 180);
            });
        }
        function start() {
            var lc = document.querySelector('#live-canvas');
            if (!lc) { setTimeout(start, 300); return; }
            new MutationObserver(schedule).observe(lc, { childList: true, subtree: true });
            observeAll(); layout();
        }
        if (document.readyState !== 'loading') start();
        else document.addEventListener('DOMContentLoaded', start);
        window.addEventListener('resize', layout);
        // Images/iframes finishing load change widget height — relayout then.
        window.addEventListener('load', layout);
    })();
    </script>
</body>
</html>

version: "3.8"

services:
  html-notes:
    image: html-notes:latest
    container_name: html-notes
    user: ""
    ports:
      - "8035:8035"
    environment:
      - PORT=8035
      - DATABASE_URL=/app/data/notes.db
      - VLLM_URL=http://10.0.0.141:8000
      - PRISM_URL=http://10.0.0.16:7777
      # Vault-backed secrets (GOOGLE_API_KEY for the Places map). Interpolated from
      # the staged .env at deploy — the key itself is never written to the repo.
      - VAULT_SERVICE_URL=${VAULT_SERVICE_URL:-http://10.0.0.16:5599}
      - VAULT_SERVICE_TOKEN=${VAULT_SERVICE_TOKEN:-}
      # Deep-research route imports the shared lazycat.research helper, which is
      # volume-mounted below (not baked into the image). Same pattern as
      # trading-service/trading-client.
      - PYTHONPATH=/app:/app/lazycat-sdk
      # The DEEP_RESEARCH agent lives on the lazy-tool-service gateway.
      - LAZY_AGENT_URL=${LAZY_AGENT_URL:-http://10.0.0.16:5591}
      # Shared secret for /internal/execute auth (caller: lazy-tool-service).
      # Interpolated from the staged .env (deploy-kit/.env.deploy) at deploy;
      # empty = endpoint runs in compat (unauthenticated) mode with a warning.
      - INTERNAL_EXECUTE_TOKEN=${INTERNAL_EXECUTE_TOKEN:-}
      # portal-service inventory feeds the App Hub widget + open_app tool.
      - PORTAL_SERVICE_URL=${PORTAL_SERVICE_URL:-http://10.0.0.16:4001}
    volumes:
      - ./data:/app/data
      # Shared SDK (research helper) — synced to the NAS by deploy.sh's
      # EXTRA_SSH_SYNC. Read-only so the container can't mutate it.
      - ../lazycat-sdk:/app/lazycat-sdk:ro
      # Notes saved from the canvas are written as .md files with frontmatter to
      # OBSIDIAN_VAULT_DIR (default /app/data/vault → ./data/vault on the NAS, so
      # it works out of the box). To piggyback on your REAL Obsidian vault, mount
      # it here (writable, uid 1001 must have access) and set OBSIDIAN_VAULT_DIR:
      # - /volume1/Obsidian/MyVault:/app/vault
      # then add `- OBSIDIAN_VAULT_DIR=/app/vault` to environment above.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8035/health/app"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
